[project]
name = "pianoflow-backend"
version = "0.1.0"
description = "Piano shop operations and AI assistant API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "openai>=1.60,<3",
  "langgraph>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.28,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
